<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Program</title>
</head>
<style>
html::-webkit-scrollbar, 
body::-webkit-scrollbar {
  display: none;
}
</style>
<body style="margin: 0;">
    <canvas id="canvas" style="display: block;"></canvas>

    <script>
        const PARENT_ORIGIN = document.referrer
            ? new URL(document.referrer).origin
            : null;
        // LIVE_VARIABLES
        const LIVE_VARIABLES = new Set([['strength', 'distance_scaler', 'viscocity', 'smoothing_radius', 'gravity', 'timeStep', 'stepsPerRender', 'max_speed', 'rest_density', 'gas_constant', 'damping']]);

        const sendToParent = message => {
            if (PARENT_ORIGIN) parent.postMessage(message, PARENT_ORIGIN);
        };

        const params = new URLSearchParams(window.location.search);

        const width = Number(params.get("width")) || 600;
        const height = Number(params.get("height")) || 600;

        // Variables
        const  strength  = Number(params.get(" strength ")) ||  40000 ;
        const  distance_scaler  = Number(params.get(" distance_scaler ")) ||  40 ;
        const  viscocity  = Number(params.get(" viscocity ")) ||  10 ;
        const  num_particles  = Number(params.get(" num_particles ")) ||  1000 ;
        const  mass  = Number(params.get(" mass ")) ||  1 ;
        const  smoothing_radius  = Number(params.get(" smoothing_radius ")) ||  16 ;
        const  gravity  = Number(params.get(" gravity ")) ||  200 ;
        const  timeStep  = Number(params.get(" timeStep ")) ||  0.005 ;
        const  stepsPerRender  = Number(params.get(" stepsPerRender ")) || 1 ;
        const  max_speed  = Number(params.get(" max_speed ")) ||  200 ;
        const  rest_density  = Number(params.get(" rest_density ")) ||  8 ;
        const  gas_constant  = Number(params.get(" gas_constant ")) ||  200 ;
        const  damping  = Number(params.get(" damping ")) ||  0.6 ;

        const canvas = document.getElementById("canvas");
        canvas.width = width;
        canvas.height = height;

        let firstOutputLogged = false;
        var Module = {
            canvas,
            programWidth: width,
            programHeight: height, // Variables
            strength: strength,
            distance_scaler: distance_scaler,
            viscocity: viscocity,
            num_particles: num_particles,
            mass: mass,
            smoothing_radius: smoothing_radius,
            gravity: gravity,
            timeStep: timeStep,
            stepsPerRender: stepsPerRender,
            max_speed: max_speed,
            rest_density: rest_density,
            gas_constant: gas_constant,
            damping: damping,
            onRuntimeInitialized: () => {
                sendToParent({ type: "program-ready" });
            },
            print: text => {
                if (!firstOutputLogged) {
                    console.debug("Module.print called:", text);
                    firstOutputLogged = true;
                }
                sendToParent({ type: "emscripten-output", stream: "stdout", text });
            },
            printErr: text => {
                if (!firstOutputLogged) {
                    console.debug("Module.printErr called:", text);
                    firstOutputLogged = true;
                }
                sendToParent({ type: "emscripten-output", stream: "stderr", text });
            }
            
        };
        window.addEventListener("message", event => {
            if (!PARENT_ORIGIN || event.source !== parent || event.origin !== PARENT_ORIGIN) return;
        
            const message = event.data;
            if (message?.type !== "set-variable") return;
            if (!LIVE_VARIABLES.has(message.id)) return;
            if (typeof message.value !== "number" || !Number.isFinite(message.value)) return;
        
            Module[message.id] = message.value;
        });

    </script>

    <script src="index.js"></script>
</body>
</html>
